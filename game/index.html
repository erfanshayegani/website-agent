<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keep the Secret 🤫 · Erfan Shayegani</title>
    <meta
      name="description"
      content="A jailbreak mini-game: an on-device LFM2.5 agent knows a secret word. You have 5 messages to make it slip."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤫</text></svg>" />
    <!-- Same saved theme as erfanshayegani.github.io (shared origin, key "theme"). -->
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem("theme"); } catch (e) {}
        if (theme !== "dark" && theme !== "light")
          theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/game/main.tsx"></script>
  </body>
</html>
