name = "website-agent-webpage-proxy"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGINS = "https://erfanshayegani.github.io"

# Per-visitor limit: 30 page reads per 60 s per IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
